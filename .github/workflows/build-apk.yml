# 云端自动打包：推送到 main/master 后自动构建 release APK，构建产物在 Actions 页面下载
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 项目 Gradle 配置（AGP 9.x / Kotlin jvmTarget 17）要求 JDK 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter（最新稳定版，自动缓存 pub 依赖）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: wendao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
